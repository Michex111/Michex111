<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Chukwuebuka Madu — backend and systems engineer</title>
  <desc id="d">Animated banner with a typing line describing current work, and a live-looking diagram of the Transform request path: MCP agents and a React SPA call a FastAPI service backed by PostgreSQL and Redis Streams, which feed workers that write to S3 storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A14"/><stop offset="1" stop-color="#0C1226"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0F2FE"/><stop offset=".55" stop-color="#A5B4FC"/><stop offset="1" stop-color="#D8B4FE"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".55"/><stop offset=".5" stop-color="#3B82F6" stop-opacity=".15"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".55"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#8FA3D8" fill-opacity=".22"/></pattern>
    <radialGradient id="fade" cx=".7" cy=".45" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="m"><rect width="1200" height="400" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="400" rx="26"/></clipPath>
    <style>
      .a1{animation:drift1 22s ease-in-out infinite alternate}
      .a2{animation:drift2 26s ease-in-out infinite alternate}
      .a3{animation:drift3 30s ease-in-out infinite alternate}
      @keyframes drift1{to{transform:translate(140px,40px)}}
      @keyframes drift2{to{transform:translate(-160px,-30px)}}
      @keyframes drift3{to{transform:translate(90px,-60px)}}
      .flow{animation:flow 1.6s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}
      @keyframes blink{50%{fill-opacity:0}}
      @keyframes w0{0.00%{transform:scaleX(0);animation-timing-function:steps(42,end)}10.50%{transform:scaleX(1)}21.50%{transform:scaleX(1);animation-timing-function:steps(42,end)}24.50%{transform:scaleX(0)}100%{transform:scaleX(0)}} @keyframes c0{0.00%{transform:translateX(0px);animation-timing-function:steps(42,end)}10.50%{transform:translateX(504px)}21.50%{transform:translateX(504px);animation-timing-function:steps(42,end)}24.50%{transform:translateX(0px)}100%{transform:translateX(0px)}} @keyframes v0{0%{opacity:1}24.99%{opacity:1}25.00%{opacity:0}100%{opacity:0}} .w0{animation:w0 18.0s infinite} .c0{animation:c0 18.0s infinite, blink 1s step-end infinite} .v0{animation:v0 18.0s infinite} @keyframes w1{0%{transform:scaleX(0)}25.00%{transform:scaleX(0);animation-timing-function:steps(44,end)}35.50%{transform:scaleX(1)}46.50%{transform:scaleX(1);animation-timing-function:steps(44,end)}49.50%{transform:scaleX(0)}100%{transform:scaleX(0)}} @keyframes c1{0%{transform:translateX(0px)}25.00%{transform:translateX(0px);animation-timing-function:steps(44,end)}35.50%{transform:translateX(528px)}46.50%{transform:translateX(528px);animation-timing-function:steps(44,end)}49.50%{transform:translateX(0px)}100%{transform:translateX(0px)}} @keyframes v1{0%{opacity:0}24.99%{opacity:0}25.00%{opacity:1}49.99%{opacity:1}50.00%{opacity:0}100%{opacity:0}} .w1{animation:w1 18.0s infinite} .c1{animation:c1 18.0s infinite, blink 1s step-end infinite} .v1{animation:v1 18.0s infinite} @keyframes w2{0%{transform:scaleX(0)}50.00%{transform:scaleX(0);animation-timing-function:steps(48,end)}60.50%{transform:scaleX(1)}71.50%{transform:scaleX(1);animation-timing-function:steps(48,end)}74.50%{transform:scaleX(0)}100%{transform:scaleX(0)}} @keyframes c2{0%{transform:translateX(0px)}50.00%{transform:translateX(0px);animation-timing-function:steps(48,end)}60.50%{transform:translateX(576px)}71.50%{transform:translateX(576px);animation-timing-function:steps(48,end)}74.50%{transform:translateX(0px)}100%{transform:translateX(0px)}} @keyframes v2{0%{opacity:0}49.99%{opacity:0}50.00%{opacity:1}74.99%{opacity:1}75.00%{opacity:0}100%{opacity:0}} .w2{animation:w2 18.0s infinite} .c2{animation:c2 18.0s infinite, blink 1s step-end infinite} .v2{animation:v2 18.0s infinite} @keyframes w3{0%{transform:scaleX(0)}75.00%{transform:scaleX(0);animation-timing-function:steps(47,end)}85.50%{transform:scaleX(1)}96.50%{transform:scaleX(1);animation-timing-function:steps(47,end)}99.50%{transform:scaleX(0)}100%{transform:scaleX(0)}} @keyframes c3{0%{transform:translateX(0px)}75.00%{transform:translateX(0px);animation-timing-function:steps(47,end)}85.50%{transform:translateX(564px)}96.50%{transform:translateX(564px);animation-timing-function:steps(47,end)}99.50%{transform:translateX(0px)}100%{transform:translateX(0px)}} @keyframes v3{0%{opacity:0}74.99%{opacity:0}75.00%{opacity:1}99.99%{opacity:1}100.00%{opacity:0}100%{opacity:0}} .w3{animation:w3 18.0s infinite} .c3{animation:c3 18.0s infinite, blink 1s step-end infinite} .v3{animation:v3 18.0s infinite}
      @media (prefers-reduced-motion: reduce){.a1,.a2,.a3,.flow{animation:none}}

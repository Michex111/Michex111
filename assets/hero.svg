        <text clip-path="url(#clip3)" x="0" y="0" textLength="564" lengthAdjust="spacingAndGlyphs" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#BFEFFF">domain-driven FastAPI backends with clean seams</text>
        <rect class="c3" x="1" y="-19" width="10" height="23" rx="1.5" fill="#22D3EE"/>
      </g>
      </g>
    </g>

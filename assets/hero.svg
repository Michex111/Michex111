        <text clip-path="url(#clip1)" x="0" y="0" textLength="528" lengthAdjust="spacingAndGlyphs" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#BFEFFF">CPython C-extensions for runtime type safety</text>
        <rect class="c1" x="1" y="-19" width="10" height="23" rx="1.5" fill="#22D3EE"/>
      </g>
      <g class="v2">
        <clipPath id="clip2"><rect class="w2" x="0" y="-24" width="576" height="34" transform="scale(0 1)"/></clipPath>
        <text clip-path="url(#clip2)" x="0" y="0" textLength="576" lengthAdjust="spacingAndGlyphs" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#BFEFFF">MCP servers that let AI agents use real software</text>
        <rect class="c2" x="1" y="-19" width="10" height="23" rx="1.5" fill="#22D3EE"/>
      </g>
      <g class="v3">

    <text x="-3" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Chukwuebuka Madu</text>
    <text x="0" y="206" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#E6EDF7" font-weight="500">Backend &amp; systems engineer.</text>
    <text x="0" y="238" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#9AA8C7">I build the machinery behind the interface.</text>
    <g transform="translate(0 300)">
      <text x="0" y="0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#8B5CF6">building →</text>
      <g transform="translate(128 0)">
      <g class="v0">
        <clipPath id="clip0"><rect class="w0" x="0" y="-24" width="504" height="34" transform="scale(0 1)"/></clipPath>
        <text clip-path="url(#clip0)" x="0" y="0" textLength="504" lengthAdjust="spacingAndGlyphs" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#BFEFFF">distributed job pipelines on Redis Streams</text>
        <rect class="c0" x="1" y="-19" width="10" height="23" rx="1.5" fill="#22D3EE"/>
      </g>
      <g class="v1">
